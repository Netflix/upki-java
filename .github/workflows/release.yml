name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: ${{ github.repository == 'Netflix/upki-java' }}
    environment: Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up compatibility JDK 8
        id: java8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'

      - name: Set up development JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version-file: .java-version

      - name: Set up ja
        uses: Netflix/ja/.github/actions/setup-ja@v0.26.16

      - name: Configure release
        run: echo "BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: ja test --all

      - name: Test Java 8 compatibility probes
        env:
          UPKI_TEST_JAVA_HOME: ${{ steps.java8.outputs.path }}
        run: ja test --all

      - name: Assemble and validate production artifact
        env:
          TEST_JAVA_HOME: ${{ steps.java8.outputs.path }}
        run: |
          ja -p com.netflix.security.upki assemble --module-version "$BUILD_VERSION" build/artifacts
          artifact=build/artifacts/com.netflix.security.upki.jar
          jar --validate --file "$artifact"
          jar --describe-module --file "$artifact" --release 9
          internals=$(jdeps --multi-release 9 --jdk-internals "$artifact")
          if [[ -n "$internals" ]]; then
            printf '%s\n' "$internals"
            exit 1
          fi
          "$TEST_JAVA_HOME/bin/java" "-javaagent:$artifact" -version
          java "-javaagent:$artifact" -version

      - name: Publish production module to Maven Central
        run: ja -p com.netflix.security.upki maven deploy-central --module-version "$BUILD_VERSION"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.ORG_SONATYPE_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.ORG_SONATYPE_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.ORG_SIGNING_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.ORG_SIGNING_PASSWORD }}

  github-release:
    name: GitHub Release
    if: ${{ github.repository == 'Netflix/upki-java' }}
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        run: |
          arguments=(
            "$GITHUB_REF_NAME"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
          )
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${arguments[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
